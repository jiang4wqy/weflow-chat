name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.10

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.1
          cache: npm
          cache-dependency-path: validator-node/package-lock.json

      - name: Install fixed test tools
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check "pytest>=8,<9"
          Install-Module Pester -RequiredVersion 4.10.1 -Scope CurrentUser -Force -SkipPublisherCheck
          npm --prefix validator-node ci --ignore-scripts --registry=https://registry.npmjs.org

      - name: Python tests
        shell: powershell
        run: |
          $env:PYTHONPATH = "src"
          $testBase = "C:\wct\pytest-$([Guid]::NewGuid().ToString('N'))"
          python -m pytest -q --basetemp $testBase

      - name: Node tests and audit
        shell: powershell
        run: |
          npm --prefix validator-node test
          npm --prefix validator-node audit --omit=dev --registry=https://registry.npmjs.org

      - name: PowerShell tests
        shell: powershell
        run: |
          Import-Module Pester -RequiredVersion 4.10.1
          $scripts = @(
            Get-ChildItem tests\powershell\*.Tests.ps1 |
              ForEach-Object FullName
          ) + @(
            Get-ChildItem vss-helper\tests\*.Tests.ps1 |
              ForEach-Object FullName
          )
          $result = Invoke-Pester -Script $scripts -PassThru
          if ($result.FailedCount -ne 0) { throw "pester_failed" }

      - name: Public-boundary gates
        shell: powershell
        run: |
          python tools/privacy_scan.py --repo .
          python tools/runtime_boundary_scan.py --repo .
          git diff --check
          if (git status --porcelain=v1) { throw "dirty_ci_tree" }
